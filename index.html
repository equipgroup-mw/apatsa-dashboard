<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// 🌐 Your published Google Sheet CSV URL
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1knivWdKyjLIxSNshbJOb7p0Iv-JzMiZmRsP0bID8jc-NTOQnexsBTNDjXDm9uPyOsJwA7mfdBa6P/pub?gid=0&single=true&output=csv";

// 📦 Fallback data (used if fetch fails)
const FALLBACK_DATA = [
  { name:"Nkhotakota Union", coops:7, hectarage:1341, largestHect:840, largestCoop:"Kasipa Cooperative", smallestHect:15, smallestCoop:"Mkaika Cooperative", valueChains:"Rice, G/nuts", membership:841, male:268, female:347, youth:261, plwd:0 },
  { name:"Salima Union", coops:4, hectarage:547.2, largestHect:222, largestCoop:"Jumabungus Cooperative", smallestHect:74, smallestCoop:"Senga Hills", valueChains:"Rice", membership:633, male:257, female:365, youth:196, plwd:0 },
  { name:"Mwandama", coops:0, hectarage:0, largestHect:0, largestCoop:"", smallestHect:0, smallestCoop:"", valueChains:"", membership:0, male:0, female:0, youth:0, plwd:0 },
  { name:"Comsip 1", coops:0, hectarage:0, largestHect:0, largestCoop:"", smallestHect:0, smallestCoop:"", valueChains:"", membership:0, male:0, female:0, youth:0, plwd:0 },
  { name:"Comsip 2", coops:0, hectarage:0, largestHect:0, largestCoop:"", smallestHect:0, smallestCoop:"", valueChains:"", membership:0, male:0, female:0, youth:0, plwd:0 },
  { name:"Mzuzu Coffee", coops:0, hectarage:0, largestHect:0, largestCoop:"", smallestHect:0, smallestCoop:"", valueChains:"", membership:0, male:0, female:0, youth:0, plwd:0 },
  { name:"HIMACUL", coops:0, hectarage:0, largestHect:0, largestCoop:"", smallestHect:0, smallestCoop:"", valueChains:"", membership:0, male:0, female:0, youth:0, plwd:0 },
  { name:"Dikirani 1", coops:0, hectarage:0, largestHect:0, largestCoop:"", smallestHect:0, smallestCoop:"", valueChains:"", membership:0, male:0, female:0, youth:0, plwd:0 },
  { name:"Dikirani 2", coops:0, hectarage:0, largestHect:0, largestCoop:"", smallestHect:0, smallestCoop:"", valueChains:"", membership:0, male:0, female:0, youth:0, plwd:0 },
  { name:"Machinga Union", coops:0, hectarage:0, largestHect:0, largestCoop:"", smallestHect:0, smallestCoop:"", valueChains:"", membership:0, male:0, female:0, youth:0, plwd:0 }
];

// Global variables
let DATA = [];
let TOTALS = {};

// 🔧 Utility functions
const n = v => Number(v) || 0;
const pct = (a,b) => b > 0 ? Math.round(a / b * 100) : 0;
const fmt = v => v.toLocaleString();

// 📥 CSV Parser (handles quoted fields and commas inside values)
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];
    
    if (char === '"' && !inQuotes) {
      inQuotes = true;
    } else if (char === '"' && inQuotes && next === '"') {
      field += '"';
      i++;
    } else if (char === '"' && inQuotes) {
      inQuotes = false;
    } else if (char === ',' && !inQuotes) {
      row.push(field.trim().replace(/^"|"$/g, ''));
      field = '';
    } else if ((char === '\n' || char === '\r') && !inQuotes) {
      if (field || row.length) {
        row.push(field.trim().replace(/^"|"$/g, ''));
        if (row.some(c => c)) rows.push(row);
        row = [];
        field = '';
      }
      if (char === '\r' && next === '\n') i++;
    } else {
      field += char;
    }
  }
  if (field || row.length) {
    row.push(field.trim().replace(/^"|"$/g, ''));
    if (row.some(c => c)) rows.push(row);
  }
  return rows.filter(r => r.length > 1 || r[0]);
}

// 🔄 Fetch and process live data
async function fetchLiveData() {
  try {
    const response = await fetch(CSV_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const csvText = await response.text();
    const rows = parseCSV(csvText);
    
    if (rows.length < 2) throw new Error('No data rows found');
    
    const headers = rows[0].map(h => h.toLowerCase().trim());
    const data = [];
    const totals = { coops:0, hectarage:0, membership:0, male:0, female:0, youth:0, plwd:0 };
    
    // Map CSV columns (adjust these names to match your actual CSV headers)
    const col = {
      name: headers.findIndex(h => h.includes('union') || h.includes('secondary') || h === 'column 1'),
      coops: headers.findIndex(h => h.includes('# of cooperatives') || h.includes('count')),
      hectarage: headers.findIndex(h => h.includes('total hectarage') || h.includes('hectares')),
      largestHect: headers.findIndex(h => h.includes('largest hectarage')),
      largestCoop: headers.findIndex(h => h.includes('co-op (largest)') || h.includes('largest cooperative')),
      smallestHect: headers.findIndex(h => h.includes('smallest hectarage')),
      smallestCoop: headers.findIndex(h => h.includes('co-op (smallest)') || h.includes('smallest cooperative')),
      valueChains: headers.findIndex(h => h.includes('value chains list') || h.includes('value chains')),
      membership: headers.findIndex(h => h.includes('total membership')),
      male: headers.findIndex(h => h === 'male'),
      female: headers.findIndex(h => h === 'female'),
      youth: headers.findIndex(h => h === 'youth'),
      plwd: headers.findIndex(h => h.includes('plwd') || h.includes('disability'))
    };
    
    // Process each row
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r[col.name] || r[col.name].trim() === '') continue;
      
      const item = {
        name: r[col.name] || '',
        coops: n(r[col.coops]),
        hectarage: n(r[col.hectarage]),
        largestHect: n(r[col.largestHect]),
        largestCoop: r[col.largestCoop] || '',
        smallestHect: n(r[col.smallestHect]),
        smallestCoop: r[col.smallestCoop] || '',
        valueChains: r[col.valueChains] || '',
        membership: n(r[col.membership]),
        male: n(r[col.male]),
        female: n(r[col.female]),
        youth: n(r[col.youth]),
        plwd: n(r[col.plwd])
      };
      
      data.push(item);
      
      // Accumulate totals
      totals.coops += item.coops;
      totals.hectarage += item.hectarage;
      totals.membership += item.membership;
      totals.male += item.male;
      totals.female += item.female;
      totals.youth += item.youth;
      totals.plwd += item.plwd;
    }
    
    // Sort by # of cooperatives (largest first)
    data.sort((a, b) => b.coops - a.coops);
    
    return { data, totals };
    
  } catch (err) {
    console.warn('⚠️ Live data fetch failed, using fallback data:', err.message);
    // Return fallback with calculated totals
    const totals = FALLBACK_DATA.reduce((acc, r) => {
      acc.coops += r.coops;
      acc.hectarage += r.hectarage;
      acc.membership += r.membership;
      acc.male += r.male;
      acc.female += r.female;
      acc.youth += r.youth;
      acc.plwd += r.plwd;
      return acc;
    }, { coops:0, hectarage:0, membership:0, male:0, female:0, youth:0, plwd:0 });
    
    return { data: FALLBACK_DATA, totals };
  }
}

// 🎨 Render the dashboard with current DATA/TOTALS
function renderDashboard() {
  const active = DATA.filter(r => r.coops > 0 && r.hectarage > 0);
  const enrolled = DATA.filter(r => r.coops > 0);
  
  // 1️⃣ Top Metrics
  document.getElementById('top-metrics').innerHTML = [
    { lbl:'Cooperative leads contacted', val: TOTALS.coops, sub: enrolled.length+' active unions · 1 lead per coop', cls:'accent-blue' },
    { lbl:'Total cooperatives', val: TOTALS.coops, sub: enrolled.length+' unions with data', cls:'accent-blue' },
    { lbl:'Total land in use', val: fmt(TOTALS.hectarage)+' ha', sub: active.length+' unions reporting land', cls:'accent-teal' },
    { lbl:'Total membership', val: fmt(TOTALS.membership), sub: 'across all cooperatives', cls:'' },
    { lbl:'Female members', val: pct(TOTALS.female,TOTALS.membership)+'%', sub: fmt(TOTALS.female)+' of '+fmt(TOTALS.membership), cls:'accent-purple' },
    { lbl:'Youth members', val: pct(TOTALS.youth,TOTALS.membership)+'%', sub: fmt(TOTALS.youth)+' of '+fmt(TOTALS.membership), cls:'accent-purple' }
  ].map(m => `<div class="metric ${m.cls}"><div class="lbl">${m.lbl}</div><div class="val">${m.val}</div><div class="sub">${m.sub}</div></div>`).join('');
  
  // 2️⃣ Union Table
  const tHead = ['Union','Coops','Hectarage','Membership','Female','Youth','Status'].map(h=>`<th>${h}</th>`).join('');
  const tRows = DATA.map(r => {
    const status = r.coops>0 && r.membership>0 ? `<span class="badge badge-active">Active</span>`
                 : r.coops>0 ? `<span class="badge badge-partial">Enrolled</span>`
                 : `<span class="badge badge-inactive">Pending</span>`;
    const femPct = r.membership>0 ? ` <span style="color:#1D9E75;font-size:11px;">(${pct(r.female,r.membership)}%)</span>` : '';
    const youthPct = r.membership>0 ? ` <span style="color:#7F77DD;font-size:11px;">(${pct(r.youth,r.membership)}%)</span>` : '';
    return `<tr>
      <td style="font-weight:600;color:#222;">${r.name}</td>
      <td>${r.coops||'—'}</td>
      <td>${r.hectarage>0?fmt(r.hectarage)+' ha':'—'}</td>
      <td>${r.membership>0?fmt(r.membership):'—'}</td>
      <td>${r.female>0?fmt(r.female):'—'}${femPct}</td>
      <td>${r.youth>0?fmt(r.youth):'—'}${youthPct}</td>
      <td>${status}</td>
    </tr>`;
  }).join('');
  document.getElementById('union-table').innerHTML = `<thead><tr>${tHead}</tr></thead><tbody>${tRows}</tbody>`;
  
  // 3️⃣ Hectarage Bars
  const maxHect = active.length ? Math.max(...active.map(r=>r.hectarage)) : 1;
  document.getElementById('hect-bars').innerHTML = active.map(r=>`
    <div class="bar-row">
      <div class="bar-label" title="${r.name}">${r.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct(r.hectarage,maxHect)}%;background:#1D9E75;"></div></div>
      <div class="bar-val">${fmt(r.hectarage)} ha</div>
    </div>`).join('') || '<p style="font-size:12px;color:#bbb;">No land data available yet.</p>';
  
  // 4️⃣ Largest/Smallest Highlights
  if (active.length > 0) {
    const byLargest = active.slice().sort((a,b)=>b.largestHect-a.largestHect)[0];
    const bySmallest = active.slice().sort((a,b)=>a.smallestHect-b.smallestHect && a.smallestHect>0)[0] || byLargest;
    document.getElementById('hl-row').innerHTML = `
      <div class="hl-card largest">
        <div class="hl-label">&#8593; Largest cooperative</div>
        <div class="hl-name">${byLargest.largestCoop || '—'}</div>
        <div class="hl-val">${byLargest.largestHect} ha &mdash; ${byLargest.name}</div>
      </div>
      <div class="hl-card smallest">
        <div class="hl-label">&#8595; Smallest cooperative</div>
        <div class="hl-name">${bySmallest.smallestCoop || '—'}</div>
        <div class="hl-val">${bySmallest.smallestHect} ha &mdash; ${bySmallest.name}</div>
      </div>`;
  } else {
    document.getElementById('hl-row').innerHTML = '<p style="font-size:12px;color:#bbb;">No cooperative size data yet.</p>';
  }
  
  // 5️⃣ Value Chains
  const allVCs = [...new Set(active.flatMap(r => 
    (r.valueChains || '').split(',').map(v=>v.trim()).filter(Boolean)
  ))];
  document.getElementById('vc-list').innerHTML = allVCs.length 
    ? allVCs.map(v=>`<span class="vc-pill">${v}</span>`).join('')
    : '<p style="font-size:12px;color:#bbb;">No value chains recorded yet.</p>';
  
  // 6️⃣ Membership Bars
  const withMemb = enrolled.filter(r=>r.membership>0);
  const maxMemb = withMemb.length ? Math.max(...withMemb.map(r=>r.membership)) : 1;
  document.getElementById('memb-bars').innerHTML = withMemb.map(r=>`
    <div class="bar-row">
      <div class="bar-label" title="${r.name}">${r.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct(r.membership,maxMemb)}%;background:#7F77DD;"></div></div>
      <div class="bar-val">${fmt(r.membership)}</div>
    </div>`).join('') || '<p style="font-size:12px;color:#bbb;">No membership data available yet.</p>';
  
  // 7️⃣ Donut Chart (destroy existing if any)
  const donutCtx = document.getElementById('donutChart');
  if (window.donutChartInstance) window.donutChartInstance.destroy();
  
  const donutColors = ['#1D9E75','#7F77DD','#D3D1C7'];
  const donutLabels = ['Female','Youth','Male / other'];
  const donutData = [TOTALS.female, TOTALS.youth, TOTALS.male];
  
  window.donutChartInstance = new Chart(donutCtx, {
    type:'doughnut',
    data:{ labels:donutLabels, datasets:[{ data:donutData, backgroundColor:donutColors, borderWidth:2, borderColor:'#fff' }] },
    options:{ 
      responsive:true, maintainAspectRatio:false, 
      plugins:{ 
        legend:{ display:false }, 
        tooltip:{ callbacks:{ label: ctx => ` ${ctx.label}: ${fmt(ctx.parsed)} (${pct(ctx.parsed,TOTALS.membership)}%)` } } 
      }, 
      cutout:'65%' 
    }
  });
  
  document.getElementById('donut-legend').innerHTML = donutLabels.map((l,i)=>`
    <div class="donut-legend-row">
      <div class="donut-legend-label"><span class="legend-sq" style="background:${donutColors[i]};"></span>${l}</div>
      <div class="donut-legend-val">${fmt(donutData[i])} <span style="color:#bbb;font-weight:400;">(${pct(donutData[i],TOTALS.membership)}%)</span></div>
    </div>`).join('');
  
  // 8️⃣ Female Share Bars
  const withFemale = withMemb.filter(r=>r.female>0);
  document.getElementById('female-bars').innerHTML = withFemale.map(r=>{
    const p = pct(r.female,r.membership);
    return `<div class="bar-row">
      <div class="bar-label" title="${r.name}">${r.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:#1D9E75;"></div></div>
      <div class="bar-val">${p}% <span style="color:#bbb;">(${fmt(r.female)})</span></div>
    </div>`;
  }).join('') || '<p style="font-size:12px;color:#bbb;">No gender data available yet.</p>';
  
  // 9️⃣ Youth Share Bars
  const withYouth = withMemb.filter(r=>r.youth>0);
  document.getElementById('youth-bars').innerHTML = withYouth.map(r=>{
    const p = pct(r.youth,r.membership);
    return `<div class="bar-row">
      <div class="bar-label" title="${r.name}">${r.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:#7F77DD;"></div></div>
      <div class="bar-val">${p}% <span style="color:#bbb;">(${fmt(r.youth)})</span></div>
    </div>`;
  }).join('') || '<p style="font-size:12px;color:#bbb;">No youth data available yet.</p>';
  
  // 🔟 Stacked Bar Chart
  const stackedCtx = document.getElementById('stackedChart');
  if (window.stackedChartInstance) window.stackedChartInstance.destroy();
  
  const stackHeight = Math.max(withMemb.length * 50 + 60, 200);
  document.getElementById('stacked-wrap').style.height = stackHeight + 'px';
  
  window.stackedChartInstance = new Chart(stackedCtx, {
    type:'bar',
    data:{
      labels: withMemb.map(r=>r.name),
      datasets:[
        { label:'Female', data:withMemb.map(r=>r.female), backgroundColor:'#1D9E75', stack:'s' },
        { label:'Youth', data:withMemb.map(r=>r.youth), backgroundColor:'#7F77DD', stack:'s' },
        { label:'Male / other', data:withMemb.map(r=>r.male), backgroundColor:'#D3D1C7', stack:'s' }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ stacked:true, ticks:{ font:{ size:11 } }, grid:{ display:false } },
        y:{ stacked:true, ticks:{ font:{ size:11 } } }
      }
    }
  });
  
  // 🕐 Last Updated
  document.getElementById('updated-line').textContent = 'Last updated: ' + new Date().toLocaleDateString('en-GB', { 
    day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' 
  });
}

// 🚀 Initialize dashboard on page load

  document.getElementById('top-metrics').innerHTML = '<div class="metric" style="grid-column:1/-1;text-align:center;padding:20px;">🔄 Loading live data...</div>';
  
  // Fetch and render
  const { data, totals } = await fetchLiveData();
  DATA = data;
  TOTALS = totals;
  renderDashboard();
